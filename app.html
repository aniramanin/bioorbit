      <button class="env-card" id="envCard" type="button" aria-label="Change mission environment">

        <span class="env-name" id="envName">—</span>
        <span class="env-sub" id="envSub">—</span>
        <span class="env-change">Change environment →</span>
      </button>
      <div class="side-foot">
        <button class="ghost-btn" id="settingsBtn" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg> Settings</button>

        <div class="mission">

          <div class="mi"><span class="mi-ico"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></span><span class="mi-txt"><span class="k">Elapsed time</span><span class="v" id="met">—</span></span></div>
          <div class="mi"><span class="mi-ico"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><ellipse cx="12" cy="12" rx="10" ry="4.5" transform="rotate(-25 12 12)"/></svg></span><span class="mi-txt"><span class="k">Gravity</span><span class="v" id="mGrav">—</span></span></div>

        </div>
        <button class="who" id="whoBtn" type="button" aria-haspopup="listbox">
          <span class="avatar" id="whoAvatar">—</span>
          <span class="who-txt"><b id="whoName">—</b><small id="whoRole">—</small></span>
          <span class="caret">▾</span>
        </button>
        <div class="who-menu" id="whoMenu" role="listbox" hidden></div>
      </header>

      <div class="prompt-bar" id="promptBar" hidden></div>

      <section class="view" id="view-bridge"></section>
      <section class="view" id="view-log"></section>
      <section class="view" id="view-trends"></section>
      <section class="view" id="view-pulse"></section>
      <section class="view" id="view-reaction"></section>
      <section class="view" id="view-vision"></section>
      <section class="view" id="view-crew"></section>
      <section class="view" id="view-downlink"></section>
      <section class="view" id="view-library"></section>
      <section class="view" id="view-nasa"></section>
